name: Build Windows desktop app
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test file engine and desktop helpers
        run: python -m unittest discover -s tests -v
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.22.3
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Findspace --icon findspace.ico --add-data "findspace.ico;." Findspace.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: Findspace-Windows
          path: dist/Findspace.exe
